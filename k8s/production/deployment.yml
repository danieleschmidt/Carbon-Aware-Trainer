apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbon-training-api
  labels:
    app: carbon-training
    component: api
    version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  selector:
    matchLabels:
      app: carbon-training
      component: api
  template:
    metadata:
      labels:
        app: carbon-training
        component: api
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: carbon-training
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: carbon-training
        image: carbon-aware-trainer:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: CARBON_AWARE_ENVIRONMENT
          value: "production"
        - name: CARBON_AWARE_LOG_LEVEL
          value: "INFO"
        - name: CARBON_AWARE_CONFIG_FILE
          value: "/app/config/production.json"
        - name: CARBON_DB_URL
          valueFrom:
            secretKeyRef:
              name: carbon-secrets
              key: database_url
        - name: CARBON_REDIS_URL
          valueFrom:
            secretKeyRef:
              name: carbon-secrets
              key: redis_url
        - name: ELECTRICITYMAP_API_KEY
          valueFrom:
            secretKeyRef:
              name: carbon-api-keys
              key: electricitymap_key
        - name: WATTTIME_API_KEY
          valueFrom:
            secretKeyRef:
              name: carbon-api-keys
              key: watttime_key
        - name: PROMETHEUS_PUSHGATEWAY_URL
          value: "http://prometheus-pushgateway:9091"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: data
          mountPath: /app/data
        - name: logs
          mountPath: /app/logs
        - name: checkpoints
          mountPath: /app/checkpoints
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 10
      volumes:
      - name: config
        configMap:
          name: carbon-config
      - name: data
        persistentVolumeClaim:
          claimName: carbon-data
      - name: logs
        persistentVolumeClaim:
          claimName: carbon-logs
      - name: checkpoints
        persistentVolumeClaim:
          claimName: carbon-checkpoints
      nodeSelector:
        node-type: "compute"
      tolerations:
      - key: "carbon-training"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - carbon-training
                - key: component
                  operator: In
                  values:
                  - api
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
              - key: node-role
                operator: In
                values:
                - worker

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbon-training-worker
  labels:
    app: carbon-training
    component: worker
    version: "1.0.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: carbon-training
      component: worker
  template:
    metadata:
      labels:
        app: carbon-training
        component: worker
        version: "1.0.0"
    spec:
      serviceAccountName: carbon-training
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: carbon-worker
        image: carbon-aware-trainer:latest
        imagePullPolicy: Always
        command: ["python", "-m", "carbon_aware_trainer.worker"]
        args: ["--worker-type", "carbon-monitor"]
        env:
        - name: CARBON_AWARE_ENVIRONMENT
          value: "production"
        - name: CARBON_AWARE_LOG_LEVEL
          value: "INFO"
        - name: CARBON_AWARE_CONFIG_FILE
          value: "/app/config/production.json"
        - name: CARBON_REDIS_URL
          valueFrom:
            secretKeyRef:
              name: carbon-secrets
              key: redis_url
        - name: ELECTRICITYMAP_API_KEY
          valueFrom:
            secretKeyRef:
              name: carbon-api-keys
              key: electricitymap_key
        - name: WATTTIME_API_KEY
          valueFrom:
            secretKeyRef:
              name: carbon-api-keys
              key: watttime_key
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: data
          mountPath: /app/data
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: config
        configMap:
          name: carbon-config
      - name: data
        persistentVolumeClaim:
          claimName: carbon-data
      - name: logs
        persistentVolumeClaim:
          claimName: carbon-logs
      nodeSelector:
        node-type: "compute"

---

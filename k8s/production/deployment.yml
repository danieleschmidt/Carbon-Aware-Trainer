          value: "production"
        - name: CARBON_AWARE_LOG_LEVEL
          value: "INFO"
        - name: CARBON_AWARE_CONFIG_FILE
          value: "/app/config/production.json"
        - name: CARBON_DB_URL
          valueFrom:
            secretKeyRef:
              name: carbon-secrets
              key: database_url
        - name: CARBON_REDIS_URL
          valueFrom:
            secretKeyRef:
              name: carbon-secrets
              key: redis_url
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: data
          mountPath: /app/data
        - name: logs
          mountPath: /app/logs
        - name: checkpoints

apiVersion: v1
kind: Service
metadata:
  name: carbon-training-service
  labels:
    app: carbon-training
    component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: carbon-training
    component: api

---
apiVersion: v1
kind: Service
metadata:
  name: carbon-training-api-nodeport
  labels:
    app: carbon-training
    component: api
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 8000
    nodePort: 30080
    protocol: TCP
    name: http
  selector:
    app: carbon-training
    component: api

---
apiVersion: v1
kind: Service
metadata:
  name: carbon-training-headless
  labels:
    app: carbon-training
spec:
  clusterIP: None
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: carbon-training
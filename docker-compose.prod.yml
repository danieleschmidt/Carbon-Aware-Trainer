version: '3.8'

services:
  carbon-training:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: carbon-aware-trainer:latest
    container_name: carbon-training-main
    restart: unless-stopped
    environment:
      - CARBON_AWARE_CONFIG_FILE=/app/config/production.json
      - CARBON_AWARE_ENVIRONMENT=production
      - CARBON_AWARE_LOG_LEVEL=INFO
      - CARBON_DB_URL=postgresql://carbon_user:carbon_pass@postgres:5432/carbon_training
      - CARBON_REDIS_URL=redis://redis:6379/0
      - PROMETHEUS_PUSHGATEWAY_URL=http://pushgateway:9091
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./checkpoints:/app/checkpoints
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - pushgateway
    networks:
      - carbon-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  carbon-worker:
    image: carbon-aware-trainer:latest
    container_name: carbon-training-worker
    restart: unless-stopped
    command: ["python", "-m", "carbon_aware_trainer.worker", "--worker-type", "carbon-monitor"]
    environment:
      - CARBON_AWARE_CONFIG_FILE=/app/config/production.json
      - CARBON_AWARE_ENVIRONMENT=production
      - CARBON_REDIS_URL=redis://redis:6379/0
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - redis
      - postgres
    networks:
      - carbon-net

  carbon-scheduler:
    image: carbon-aware-trainer:latest
    container_name: carbon-training-scheduler
    restart: unless-stopped
    command: ["python", "-m", "carbon_aware_trainer.scheduler"]
    environment:
      - CARBON_AWARE_CONFIG_FILE=/app/config/production.json
      - CARBON_AWARE_ENVIRONMENT=production
      - CARBON_DB_URL=postgresql://carbon_user:carbon_pass@postgres:5432/carbon_training
      - CARBON_REDIS_URL=redis://redis:6379/0
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./checkpoints:/app/checkpoints
    depends_on:
      - postgres
      - redis
    networks:
      - carbon-net

  postgres:
    image: postgres:15-alpine
    container_name: carbon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: carbon_training
      POSTGRES_USER: carbon_user
      POSTGRES_PASSWORD: carbon_pass
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - carbon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbon_user -d carbon_training"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: carbon-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - carbon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: carbon-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - carbon-net

  pushgateway:
    image: prom/pushgateway:v1.6.0
    container_name: carbon-pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"
    networks:
      - carbon-net

  grafana:
    image: grafana/grafana:10.0.0
    container_name: carbon-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: false
      GF_INSTALL_PLUGINS: grafana-worldmap-panel,grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./docker/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - carbon-net

  nginx:
    image: nginx:1.25-alpine
    container_name: carbon-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - carbon-training
      - grafana
    networks:
      - carbon-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  carbon-net:
    driver: bridge
    name: carbon-network
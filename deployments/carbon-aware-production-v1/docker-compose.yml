version: '3.8'

services:
  carbon-aware-trainer:
    build:
      context: .
      dockerfile: Dockerfile
    image: carbon-aware-trainer:production
    container_name: carbon-aware-trainer-prod
    restart: unless-stopped
    environment:
      - CARBON_AWARE_MODE=production
      - CARBON_THRESHOLD=80
      - OPTIMIZATION_MODE=balanced
      - ENABLE_RESILIENCE=true
      - MAX_CONCURRENT_JOBS=8
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data:ro
      - ./checkpoints:/app/checkpoints
      - ./logs:/app/logs
      - ./config:/app/config:ro
    ports:
      - "8080:8080"  # Health/metrics endpoint
    networks:
      - carbon-aware-net
    depends_on:
      - redis
      - prometheus
    
  redis:
    image: redis:7-alpine
    container_name: carbon-cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - carbon-aware-net
  
  prometheus:
    image: prom/prometheus:latest
    container_name: carbon-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - carbon-aware-net
      
  grafana:
    image: grafana/grafana:latest
    container_name: carbon-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=carbon-admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/carbon-aware.json:ro
    ports:
      - "3000:3000"
    networks:
      - carbon-aware-net

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  carbon-aware-net:
    driver: bridge

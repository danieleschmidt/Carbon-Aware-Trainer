apiVersion: v1
kind: ConfigMap
metadata:
  name: carbon-aware-config
data:
  config.yaml: |
    carbon_aware:
      mode: production
      carbon_threshold: 80
      optimization_mode: balanced
      resilience_enabled: true
      max_concurrent_jobs: 8
      regions:
        preferred: ["US-WA", "EU-FR", "CA-QC"]
        excluded: ["US-WV", "PL", "IN-UP"]
      monitoring:
        enabled: true
        interval: 60
        metrics_endpoint: ":8080"
